server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: portfoliopilot-api

  data:
    mongodb:
      # Same variables the /mongodb tooling uses, so one secret serves both.
      uri: ${MONGODB_URI:mongodb://localhost:27017}
      database: ${MONGODB_DB:portfoliopilot}
      # Indexes are owned by mongodb/indexes/indexes.js, where every index is
      # documented with its rationale. Letting @Indexed build them implicitly at
      # startup would create production indexes with no review trail.
      auto-index-creation: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  jwt:
    # DEV DEFAULT ONLY. The app logs a loud warning when this value is in use.
    # Generate a real one:  openssl rand -base64 48
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-please-0123456789abcdef}
    # Access token lifetime (ms). 15 minutes.
    expiration: ${JWT_EXPIRATION:900000}
    # Refresh token lifetime (ms). 30 days.
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:2592000000}
    issuer: portfoliopilot

  cors:
    # Comma-separated. FRONTEND_URL is the documented single-origin variable;
    # the extra defaults cover the usual static-server ports for the existing
    # vanilla frontend (Live Server 5500, `npx serve` 3000, Vite 5173).
    allowed-origins: ${FRONTEND_URL:http://localhost:5173,http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8000}

  matching:
    # Weights from the spec. Must sum to 1.0 - validated at startup.
    skills-weight: ${MATCH_SKILLS_WEIGHT:0.45}
    projects-weight: ${MATCH_PROJECTS_WEIGHT:0.30}
    requirements-weight: ${MATCH_REQUIREMENTS_WEIGHT:0.25}
    # A nice-to-have skill counts this much relative to a required one.
    nice-to-have-factor: 0.5
    # Max projects returned as recommendations.
    max-recommended-projects: 5

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    root: INFO
    com.portfoliopilot: INFO
    org.springframework.data.mongodb.core.MongoTemplate: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
