<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — PortfolioPilot AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand"><span>⚡</span> Admin</div>
      <nav class="sidebar-nav">
        <a href="index.html" class="nav-item active" data-page="dash"><span class="icon">📊</span> Dashboard</a>
        <a href="users.html" class="nav-item" data-page="users"><span class="icon">👥</span> Users</a>
        <a href="job-logs.html" class="nav-item" data-page="logs"><span class="icon">📋</span> Job Analyses Log</a>
        <a href="templates.html" class="nav-item" data-page="templates"><span class="icon">🎨</span> Portfolio Templates</a>
        <a href="reports.html" class="nav-item" data-page="reports"><span class="icon">📈</span> Reports</a>
        <a href="settings.html" class="nav-item" data-page="settings"><span class="icon">⚙️</span> Settings</a>
      </nav>
      <div class="sidebar-footer">
        <a href="../index.html" class="btn btn-ghost btn-block">← Back to App</a>
        <button class="btn btn-ghost btn-block mt-2" onclick="PP.admin.logout()">Logout</button>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="main-content">
      <header class="topbar">
        <button class="menu-toggle" id="menuToggle">☰</button>
        <div class="font-semibold">Admin Dashboard</div>
      </header>

      <main class="page-content">
        <h1 class="page-title">Dashboard</h1>
        <p class="page-subtitle">Platform overview</p>

        <div class="stats-grid mb-6">
          <div class="stat-card">
            <div class="label">Total Users</div>
            <div class="value" id="statUsers">0</div>
          </div>
          <div class="stat-card">
            <div class="label">Portfolios Published</div>
            <div class="value" id="statPortfolios">0</div>
          </div>
          <div class="stat-card">
            <div class="label">Jobs Analyzed Today</div>
            <div class="value" id="statJobs">0</div>
          </div>
          <div class="stat-card">
            <div class="label">Avg Match Score</div>
            <div class="value" id="statMatch">0%</div>
          </div>
        </div>

        <div class="grid-2">
          <div class="card">
            <div class="card-header"><h2 class="card-title">Daily Signups</h2></div>
            <div class="card-body">
              <canvas id="signupsChart" height="220"></canvas>
            </div>
          </div>
          <div class="card">
            <div class="card-header"><h2 class="card-title">Top Skill Gaps</h2></div>
            <div class="card-body">
              <canvas id="gapsChart" height="220"></canvas>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script>
    // Real data from GET /api/admin/dashboard/*. The server enforces ROLE_ADMIN;
    // the localStorage flag below is only a UI hint and grants nothing.
    if (!PP.admin.requireAuth()) throw new Error('redirect');
    PP.initAppLayout('dash');

    (async () => {
      try {
        const [stats, trends, gaps] = await Promise.all([
          PP.admin.stats(),
          PP.admin.signupTrends(30),
          PP.admin.skillGaps(8),
        ]);

        document.getElementById('statUsers').textContent = stats.totalUsers.toLocaleString();
        document.getElementById('statPortfolios').textContent = stats.portfoliosPublished.toLocaleString();
        document.getElementById('statJobs').textContent = stats.jobsAnalyzedToday;
        document.getElementById('statMatch').textContent = stats.avgMatchScore + '%';

        // Gap-filled by the backend, so quiet days still plot a zero.
        const signups = trends.signups || [];
        new Chart(document.getElementById('signupsChart'), {
          type: 'line',
          data: {
            labels: signups.map(d => d.date.slice(5)),
            datasets: [{
              label: 'Signups',
              data: signups.map(d => d.value),
              borderColor: '#4F46E5',
              backgroundColor: 'rgba(79,70,229,0.1)',
              fill: true,
              tension: 0.3,
            }],
          },
          options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: { y: { beginAtZero: true, ticks: { precision: 0 } } },
          },
        });

        // Ranked by DISTINCT USERS affected, not raw occurrences, so one heavy
        // user cannot dominate the chart.
        const topGaps = gaps.topSkillGaps || [];
        new Chart(document.getElementById('gapsChart'), {
          type: 'bar',
          data: {
            labels: topGaps.map(d => d.skill),
            datasets: [{
              label: 'Users with gap',
              data: topGaps.map(d => d.usersAffected),
              backgroundColor: '#F59E0B',
            }],
          },
          options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: { y: { beginAtZero: true, ticks: { precision: 0 } } },
          },
        });
      } catch (err) {
        PP.showToast(err.message || 'Could not load dashboard data', 'error');
        if (err.status === 401 || err.status === 403) {
          setTimeout(() => { location.href = 'login.html'; }, 1200);
        }
      }
    })();
  </script>
</body>
</html>
