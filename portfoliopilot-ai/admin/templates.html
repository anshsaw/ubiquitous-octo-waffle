<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Templates — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand"><span>⚡</span> Admin</div>
      <nav class="sidebar-nav">
        <a href="index.html" class="nav-item" data-page="dash"><span class="icon">📊</span> Dashboard</a>
        <a href="users.html" class="nav-item" data-page="users"><span class="icon">👥</span> Users</a>
        <a href="job-logs.html" class="nav-item" data-page="logs"><span class="icon">📋</span> Job Analyses Log</a>
        <a href="templates.html" class="nav-item active" data-page="templates"><span class="icon">🎨</span> Portfolio Templates</a>
        <a href="reports.html" class="nav-item" data-page="reports"><span class="icon">📈</span> Reports</a>
        <a href="settings.html" class="nav-item" data-page="settings"><span class="icon">⚙️</span> Settings</a>
      </nav>
      <div class="sidebar-footer">
        <a href="../index.html" class="btn btn-ghost btn-block">← Back to App</a>
        <button class="btn btn-ghost btn-block mt-2" onclick="localStorage.removeItem('pp_admin');location.href='login.html'">Logout</button>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div class="main-content">
      <header class="topbar">
        <button class="menu-toggle" id="menuToggle">☰</button>
        <div class="font-semibold">Portfolio Templates</div>
      </header>
      <main class="page-content">
        <div class="flex justify-between items-center mb-6" style="flex-wrap:wrap;gap:1rem;">
          <div>
            <h1 class="page-title">Portfolio Templates</h1>
            <p class="page-subtitle" style="margin-bottom:0;">CRUD for portfolio templates</p>
          </div>
          <button class="btn btn-primary" id="addTpl">+ Add Template</button>
        </div>
        <div class="card">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="tplBody"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="../js/app.js"></script>
  <script>
    if (localStorage.getItem('pp_admin') !== 'true') location.href = 'login.html';
    PP.initAppLayout('templates');
    let templates = [...PP.mockTemplates];

    function render() {
      document.getElementById('tplBody').innerHTML = templates.map(t => `
        <tr>
          <td class="font-medium">${t.name}</td>
          <td>
            <label style="display:inline-flex;align-items:center;gap:0.5rem;cursor:pointer;">
              <input type="checkbox" ${t.active ? 'checked' : ''} onchange="toggleActive('${t.id}')" />
              ${t.active ? 'Active' : 'Inactive'}
            </label>
          </td>
          <td>
            <button class="btn btn-sm btn-ghost" onclick="editTpl('${t.id}')">Edit</button>
            <button class="btn btn-sm btn-ghost" onclick="deleteTpl('${t.id}')">Delete</button>
          </td>
        </tr>
      `).join('');
    }
    window.toggleActive = (id) => {
      const t = templates.find(x => x.id === id);
      if (t) t.active = !t.active;
      render();
      PP.showToast('Template status updated', 'success');
    };
    window.editTpl = (id) => {
      const t = templates.find(x => x.id === id);
      const name = prompt('Template name', t?.name);
      if (name) { t.name = name; render(); PP.showToast('Updated', 'success'); }
    };
    window.deleteTpl = (id) => {
      if (!confirm('Delete this template?')) return;
      templates = templates.filter(t => t.id !== id);
      render();
      PP.showToast('Deleted', 'success');
    };
    document.getElementById('addTpl').addEventListener('click', () => {
      const name = prompt('New template name');
      if (!name) return;
      templates.push({ id: 't' + Date.now(), name, active: true });
      render();
      PP.showToast('Template added', 'success');
    });
    render();
  </script>
</body>
</html>
