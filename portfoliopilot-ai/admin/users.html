<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Users — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand"><span>⚡</span> Admin</div>
      <nav class="sidebar-nav">
        <a href="index.html" class="nav-item" data-page="dash"><span class="icon">📊</span> Dashboard</a>
        <a href="users.html" class="nav-item active" data-page="users"><span class="icon">👥</span> Users</a>
        <a href="job-logs.html" class="nav-item" data-page="logs"><span class="icon">📋</span> Job Analyses Log</a>
        <a href="templates.html" class="nav-item" data-page="templates"><span class="icon">🎨</span> Portfolio Templates</a>
        <a href="reports.html" class="nav-item" data-page="reports"><span class="icon">📈</span> Reports</a>
        <a href="settings.html" class="nav-item" data-page="settings"><span class="icon">⚙️</span> Settings</a>
      </nav>
      <div class="sidebar-footer">
        <a href="../index.html" class="btn btn-ghost btn-block">← Back to App</a>
        <button class="btn btn-ghost btn-block mt-2" onclick="localStorage.removeItem('pp_admin');location.href='login.html'">Logout</button>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div class="main-content">
      <header class="topbar">
        <button class="menu-toggle" id="menuToggle">☰</button>
        <div class="font-semibold">Users</div>
      </header>
      <main class="page-content">
        <h1 class="page-title">Users</h1>
        <p class="page-subtitle">Manage platform users</p>
        <div class="card">
          <div class="card-header">
            <input class="form-input" id="search" placeholder="Search users..." style="max-width:260px;" />
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Portfolios</th>
                  <th>Status</th>
                  <th>Joined</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="usersBody"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="../js/app.js"></script>
  <script>
    if (localStorage.getItem('pp_admin') !== 'true') location.href = 'login.html';
    PP.initAppLayout('users');

    let users = [...PP.mockUsers];

    function render(list) {
      document.getElementById('usersBody').innerHTML = list.map(u => `
        <tr>
          <td class="font-medium">${u.name}</td>
          <td>${u.email}</td>
          <td>${u.portfolios}</td>
          <td><span class="badge ${u.status === 'active' ? 'badge-success' : 'badge-danger'}">${u.status}</span></td>
          <td>${u.joinDate}</td>
          <td>
            <button class="btn btn-sm btn-ghost" onclick="alert('View user ${u.name}')">View</button>
            <button class="btn btn-sm btn-ghost" onclick="toggleStatus('${u.id}')">${u.status === 'active' ? 'Suspend' : 'Activate'}</button>
          </td>
        </tr>
      `).join('');
    }
    window.toggleStatus = (id) => {
      const u = users.find(x => x.id === id);
      if (u) u.status = u.status === 'active' ? 'suspended' : 'active';
      render(users);
      PP.showToast('User status updated', 'success');
    };
    document.getElementById('search').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      render(users.filter(u => u.name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q)));
    });
    render(users);
  </script>
</body>
</html>
