<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Users — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand"><span>⚡</span> Admin</div>
      <nav class="sidebar-nav">
        <a href="index.html" class="nav-item" data-page="dash"><span class="icon">📊</span> Dashboard</a>
        <a href="users.html" class="nav-item active" data-page="users"><span class="icon">👥</span> Users</a>
        <a href="job-logs.html" class="nav-item" data-page="logs"><span class="icon">📋</span> Job Analyses Log</a>
        <a href="templates.html" class="nav-item" data-page="templates"><span class="icon">🎨</span> Portfolio Templates</a>
        <a href="reports.html" class="nav-item" data-page="reports"><span class="icon">📈</span> Reports</a>
        <a href="settings.html" class="nav-item" data-page="settings"><span class="icon">⚙️</span> Settings</a>
      </nav>
      <div class="sidebar-footer">
        <a href="../index.html" class="btn btn-ghost btn-block">← Back to App</a>
        <button class="btn btn-ghost btn-block mt-2" onclick="PP.admin.logout()">Logout</button>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div class="main-content">
      <header class="topbar">
        <button class="menu-toggle" id="menuToggle">☰</button>
        <div class="font-semibold">Users</div>
      </header>
      <main class="page-content">
        <h1 class="page-title">Users</h1>
        <p class="page-subtitle">Manage platform users</p>
        <div class="card">
          <div class="card-header">
            <input class="form-input" id="search" placeholder="Search users..." style="max-width:260px;" />
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Portfolios</th>
                  <th>Status</th>
                  <th>Joined</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="usersBody"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script>
    // Real users from GET /api/admin/users. Suspend/activate hit the API and
    // are persisted + audited; the old version only mutated a local array.
    if (!PP.admin.requireAuth()) throw new Error('redirect');
    PP.initAppLayout('users');

    let users = [];

    // Escape before interpolating into HTML - a name or email is user-supplied
    // data and must never be treated as markup.
    const esc = (v) => String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

    function render(list) {
      const body = document.getElementById('usersBody');
      if (!list.length) {
        body.innerHTML = '<tr><td colspan="6" class="text-sm">No users found.</td></tr>';
        return;
      }
      body.innerHTML = list.map(u => {
        const active = u.status === 'ACTIVE';
        return `
        <tr>
          <td class="font-medium">${esc(u.name)}</td>
          <td>${esc(u.email)}</td>
          <td>${u.portfolios}</td>
          <td><span class="badge ${active ? 'badge-success' : 'badge-danger'}">${esc(u.status.toLowerCase())}</span></td>
          <td>${u.joinDate ? new Date(u.joinDate).toISOString().slice(0, 10) : '-'}</td>
          <td>
            <button class="btn btn-sm btn-ghost" onclick="viewUser('${u.id}')">View</button>
            <button class="btn btn-sm btn-ghost" onclick="toggleStatus('${u.id}', ${active})">${active ? 'Suspend' : 'Activate'}</button>
          </td>
        </tr>`;
      }).join('');
    }

    async function load(search) {
      try {
        const page = await PP.admin.users({ search: search || '', size: 50 });
        users = page.content || [];
        render(users);
      } catch (err) {
        PP.showToast(err.message || 'Could not load users', 'error');
      }
    }

    window.viewUser = async (id) => {
      try {
        const detail = await PP.admin.userDetail(id);
        alert([
          detail.user.name + ' (' + detail.user.email + ')',
          'Status: ' + detail.user.status,
          'Projects: ' + detail.projects.length,
          'Recent analyses: ' + detail.recentAnalyses.length,
          'Public portfolio: ' + (detail.publishedPortfolioUrl || 'none'),
        ].join('\n'));
      } catch (err) {
        PP.showToast(err.message || 'Could not load user', 'error');
      }
    };

    window.toggleStatus = async (id, isActive) => {
      try {
        if (isActive) {
          const reason = prompt('Reason for suspension (optional):') || '';
          await PP.admin.suspendUser(id, reason);
          PP.showToast('User suspended and all sessions revoked', 'success');
        } else {
          await PP.admin.activateUser(id);
          PP.showToast('User activated', 'success');
        }
        await load(document.getElementById('search').value);
      } catch (err) {
        PP.showToast(err.message || 'Action failed', 'error');
      }
    };

    // Debounced server-side search - the old version filtered a hardcoded array.
    let timer;
    document.getElementById('search').addEventListener('input', (e) => {
      clearTimeout(timer);
      const q = e.target.value;
      timer = setTimeout(() => load(q), 300);
    });

    load('');
  </script>
</body>
</html>
