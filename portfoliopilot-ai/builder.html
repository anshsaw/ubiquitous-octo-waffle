<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Builder — PortfolioPilot AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand"><span>⚡</span> PortfolioPilot</div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item" data-page="dashboard"><span class="icon">🏠</span> Dashboard</a>
        <a href="profile.html" class="nav-item" data-page="profile"><span class="icon">👤</span> Profile</a>
        <a href="projects.html" class="nav-item" data-page="projects"><span class="icon">📁</span> My Projects</a>
        <a href="analyzer.html" class="nav-item" data-page="analyzer"><span class="icon">🔍</span> Opportunity Analyzer</a>
        <a href="match-analysis.html" class="nav-item" data-page="match"><span class="icon">📊</span> Match Analysis</a>
        <a href="builder.html" class="nav-item" data-page="builder"><span class="icon">🛠️</span> Portfolio Builder</a>
        <a href="preview.html" class="nav-item" data-page="preview"><span class="icon">👁️</span> Portfolio Preview</a>
        <a href="portfolio.html" class="nav-item" data-page="public" target="_blank"><span class="icon">🌐</span> Published Site</a>
      </nav>
      <div class="sidebar-footer">
        <button class="btn btn-ghost btn-block" onclick="PP.logout()">Logout</button>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="main-content">
      <header class="topbar">
        <button class="menu-toggle" id="menuToggle">☰</button>
        <div class="flex items-center gap-3">
          <span class="text-sm">Hi, <strong id="userName">Alex</strong></span>
        </div>
      </header>

      <main class="page-content">
        <h1 class="page-title">Portfolio Builder</h1>
        <p class="page-subtitle">Choose a template and sections, then generate your portfolio</p>

        <div class="grid-2">
          <!-- Controls -->
          <div>
            <div class="card mb-6">
              <div class="card-header">
                <h2 class="card-title">Template</h2>
              </div>
              <div class="card-body">
                <!-- Populated from GET /api/templates. The ids used to be
                     hardcoded t1-t4, which matched nothing in the database. -->
                <div class="template-grid" id="templateGrid">
                  <div class="text-sm" style="color:var(--slate-400);">Loading templates...</div>
                </div>
              </div>
            </div>

            <div class="card mb-6">
              <div class="card-header">
                <h2 class="card-title">Sections</h2>
              </div>
              <div class="card-body">
                <label class="flex items-center gap-2 mb-3" style="cursor:pointer;"><input type="checkbox" class="section-toggle" value="about" checked /> About</label>
                <label class="flex items-center gap-2 mb-3" style="cursor:pointer;"><input type="checkbox" class="section-toggle" value="skills" checked /> Skills</label>
                <label class="flex items-center gap-2 mb-3" style="cursor:pointer;"><input type="checkbox" class="section-toggle" value="projects" checked /> Projects</label>
                <label class="flex items-center gap-2 mb-3" style="cursor:pointer;"><input type="checkbox" class="section-toggle" value="education" checked /> Education</label>
                <label class="flex items-center gap-2 mb-3" style="cursor:pointer;"><input type="checkbox" class="section-toggle" value="experience" checked /> Experience</label>
                <label class="flex items-center gap-2 mb-3" style="cursor:pointer;"><input type="checkbox" class="section-toggle" value="certificates" /> Certificates</label>
                <label class="flex items-center gap-2" style="cursor:pointer;"><input type="checkbox" class="section-toggle" value="contact" checked /> Contact</label>
                <p class="form-hint mt-3" id="sectionHint" style="font-size:0.8125rem;"></p>
              </div>
            </div>

            <button id="generateBtn" class="btn btn-primary btn-lg btn-block">Generate &amp; Publish Portfolio</button>
            <p class="form-hint mt-2" id="publishResult" style="font-size:0.8125rem;text-align:center;"></p>
          </div>

          <!-- Live preview hint -->
          <div class="card">
            <div class="card-header">
              <h2 class="card-title">Live Preview</h2>
            </div>
            <div class="card-body" id="livePreview" style="min-height:320px;">
              <!-- filled by JS -->
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    if (!PP.requireAuth()) throw new Error('redirect');
    PP.initAppLayout('builder');

    const profile = PP.getProfile();

    // Real templates loaded from GET /api/templates. The old hardcoded t1-t4
    // ids matched nothing in the database, so the choice could never be saved.
    let templates = [];
    let selectedKey = null;

    const esc = (v) => String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

    const currentTemplate = () => templates.find(t => t.templateKey === selectedKey) || null;

    async function loadTemplates() {
      const grid = document.getElementById('templateGrid');
      try {
        templates = await PP.listTemplates();
      } catch (err) {
        grid.innerHTML = '<div class="text-sm" style="color:var(--danger);">Could not load templates: '
          + esc(err.message) + '</div>';
        return;
      }
      if (!templates.length) {
        grid.innerHTML = '<div class="text-sm" style="color:var(--slate-500);">No active templates. Seed the database.</div>';
        return;
      }

      // Preselect whatever the user's existing portfolio already uses, so the
      // builder opens showing their real current state rather than a default.
      let existing = null;
      try { existing = await PP.portfolios.published(); } catch (e) { /* none yet */ }
      selectedKey = (existing && existing.templateKey)
        || PP.getSelectedTemplate()
        || templates[0].templateKey;
      if (!templates.some(t => t.templateKey === selectedKey)) {
        selectedKey = templates[0].templateKey;
      }

      grid.innerHTML = templates.map(t => `
        <div class="template-card${t.templateKey === selectedKey ? ' selected' : ''}" data-key="${esc(t.templateKey)}">
          <div class="preview" style="background:${esc(t.primaryColor || '#F1F5F9')};color:${t.darkMode || t.primaryColor ? '#fff' : 'var(--slate-700)'};">${esc(t.name)}</div>
          <div class="name">${esc(t.name)}</div>
        </div>
      `).join('');

      grid.querySelectorAll('.template-card').forEach(card => {
        card.addEventListener('click', () => {
          grid.querySelectorAll('.template-card').forEach(c => c.classList.remove('selected'));
          card.classList.add('selected');
          selectedKey = card.dataset.key;
          PP.setSelectedTemplate(selectedKey);
          applyTemplateConstraints();
          updatePreview();
        });
      });

      applyTemplateConstraints();
      updatePreview();
    }

    /**
     * A template can only render the sections it declares in availableSections.
     * The backend rejects anything else with a 400, so the unsupported toggles
     * are disabled here rather than letting the user hit an error on publish.
     */
    function applyTemplateConstraints() {
      const tpl = currentTemplate();
      const available = (tpl && tpl.availableSections) || [];
      const unsupported = [];

      document.querySelectorAll('.section-toggle').forEach(cb => {
        const ok = available.includes(cb.value);
        cb.disabled = !ok;
        if (!ok) { cb.checked = false; unsupported.push(cb.value); }
        cb.parentElement.style.opacity = ok ? '1' : '0.45';
      });

      document.getElementById('sectionHint').textContent = unsupported.length
        ? `"${tpl.name}" cannot render: ${unsupported.join(', ')}.`
        : '';
    }

    document.querySelectorAll('.section-toggle').forEach(cb => {
      cb.addEventListener('change', updatePreview);
    });

    // Generate the portfolio configuration and publish it in one step, so the
    // template choice actually reaches /portfolio/{username}.
    document.getElementById('generateBtn').addEventListener('click', async () => {
      const btn = document.getElementById('generateBtn');
      const result = document.getElementById('publishResult');
      const sections = {};
      document.querySelectorAll('.section-toggle').forEach(cb => { sections[cb.value] = cb.checked; });

      btn.disabled = true;
      btn.textContent = 'Generating...';
      result.textContent = '';

      try {
        // Reuse the existing portfolio if there is one, otherwise create it.
        // Generating unconditionally would leave a new draft behind on every click.
        let portfolio = null;
        try { portfolio = await PP.portfolios.published(); } catch (e) { /* none */ }

        if (portfolio && portfolio.id) {
          portfolio = await PP.portfolios.update(portfolio.id, { templateKey: selectedKey, sections });
        } else {
          portfolio = await PP.generatePortfolio(selectedKey);
          portfolio = await PP.portfolios.update(portfolio.id, { templateKey: selectedKey, sections });
        }

        btn.textContent = 'Publishing...';
        const published = await PP.portfolios.publish(portfolio.id);

        const url = 'portfolio.html?u=' + encodeURIComponent(published.username);
        result.innerHTML = 'Published with <strong>' + esc(currentTemplate().name) + '</strong> &middot; '
          + '<a href="' + url + '" target="_blank">View live page</a>';
        PP.showToast('Portfolio published', 'success');
      } catch (err) {
        result.textContent = err.message || 'Could not publish';
        PP.showToast(err.message || 'Could not publish', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Generate & Publish Portfolio';
      }
    });

    function updatePreview() {
      const sections = Array.from(document.querySelectorAll('.section-toggle:checked')).map(c => c.value);
      const match = PP.getLastMatch();
      const recIds = match?.recommendedProjects || [];
      const projects = (profile.projects || []).filter(p => p.includeInPortfolio || recIds.includes(p.id));

      // Preview in the SELECTED template's real colours, so the choice is
      // visible before publishing instead of every template looking identical.
      const tpl = currentTemplate();
      const accent = (tpl && tpl.primaryColor) || 'var(--primary)';
      const dark = !!(tpl && tpl.darkMode);
      const surface = dark ? '#0F172A' : 'var(--slate-50)';
      const ink = dark ? '#E2E8F0' : 'var(--slate-600)';

      document.getElementById('livePreview').innerHTML = `
        <div style="border:1px solid var(--slate-200);border-radius:0.5rem;padding:1.25rem;background:${surface};color:${ink};">
          <div style="text-align:center;margin-bottom:1rem;">
            <div style="width:56px;height:56px;border-radius:50%;background:${accent};color:white;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:1.25rem;">
              ${esc((profile.name || 'A').charAt(0))}
            </div>
            <div class="font-bold mt-2">${esc(profile.name || 'Your Name')}</div>
            <div class="text-sm" style="color:${accent};">${esc(profile.title || 'Title')}</div>
          </div>
          ${sections.includes('about') ? `<p class="text-sm mb-3" style="color:${ink};">${esc((profile.bio || '').slice(0, 120))}...</p>` : ''}
          ${sections.includes('skills') ? `
            <div class="mb-3">
              <div class="text-xs font-semibold mb-1" style="color:var(--slate-500);">SKILLS</div>
              <div class="flex" style="flex-wrap:wrap;gap:0.25rem;">
                ${(profile.skills || []).slice(0, 6).map(s => `<span class="tag">${esc(s.name)}</span>`).join('')}
              </div>
            </div>` : ''}
          ${sections.includes('projects') ? `
            <div>
              <div class="text-xs font-semibold mb-1" style="color:var(--slate-500);">PROJECTS</div>
              ${projects.slice(0, 2).map(p => `<div class="text-sm font-medium">${esc(p.title)}</div>`).join('') || '<div class="text-sm" style="color:var(--slate-400);">No projects</div>'}
            </div>` : ''}
          <div class="text-xs mt-4" style="color:var(--slate-400);">Template: ${esc(tpl ? tpl.name : 'none')} · Sections: ${esc(sections.join(', '))}</div>
        </div>
      `;
    }

    loadTemplates();
  </script>
</body>
</html>
