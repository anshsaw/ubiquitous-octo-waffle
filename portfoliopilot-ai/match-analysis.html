<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Match Analysis — PortfolioPilot AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">⚡ PortfolioPilot</div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item" data-page="dashboard"><span class="icon">📊</span> Dashboard</a>
      <a href="profile.html" class="nav-item" data-page="profile"><span class="icon">👤</span> Profile</a>
      <a href="projects.html" class="nav-item" data-page="projects"><span class="icon">📁</span> My Projects</a>
      <a href="analyzer.html" class="nav-item" data-page="analyzer"><span class="icon">🎯</span> Opportunity Analyzer</a>
      <a href="match-analysis.html" class="nav-item" data-page="match"><span class="icon">📈</span> Match Analysis</a>
      <a href="builder.html" class="nav-item" data-page="builder"><span class="icon">🎨</span> Portfolio Builder</a>
      <a href="preview.html" class="nav-item" data-page="preview"><span class="icon">👁️</span> Portfolio Preview</a>
      <a href="portfolio.html" class="nav-item" data-page="public"><span class="icon">🌐</span> Published Site</a>
    </nav>
    <div class="sidebar-footer">
      <button class="btn btn-ghost btn-block" onclick="PP.logout()">Log out</button>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="main-content">
    <header class="topbar">
      <button class="btn btn-ghost" id="menuToggle">☰</button>
      <div>Hi, <strong id="userName">there</strong></div>
    </header>

    <div class="page-content" id="page">
      <p class="text-sm" style="color:var(--slate-500);">Calculating match…</p>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
  /*
   * MATCH ANALYSIS
   *
   * Answers "how well does my PUBLISHED PORTFOLIO match this job?".
   *
   * Loads a stored analysis by id — the same record the Opportunity Analyzer
   * created, and the same record the paste-a-description flow creates. The job
   * travels through the backend, not localStorage.
   *
   *   ?id=<analysisId>   a specific analysis
   *   no id              the most recent one
   *
   * Skill states come from comparing the job's demands against what the
   * portfolio DEMONSTRATES (a project or a real role) versus what it merely
   * lists. That distinction is why gaps are worded "not demonstrated in your
   * portfolio" and never "you don't know this".
   */
  if (!PP.requireAuth()) throw new Error('redirect');
  PP.initAppLayout('match');

  const page = document.getElementById('page');

  const esc = (v) => String(v == null ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

  const norm = (s) => String(s || '').toLowerCase().trim();

  function bar(label, value, colour) {
    return `
      <div class="sub-score-row mb-3">
        <div class="flex items-center justify-between">
          <span class="text-sm">${esc(label)}</span>
          <strong class="text-sm">${value}%</strong>
        </div>
        <div class="progress mt-1"><div class="progress-bar ${colour}" style="width:${value}%;"></div></div>
      </div>`;
  }

  function ringColour(n) { return n >= 75 ? '#10B981' : n >= 50 ? '#F59E0B' : '#EF4444'; }

  async function load() {
    const id = new URLSearchParams(window.location.search).get('id');
    let analysis, candidate;

    try {
      if (id) {
        analysis = await PPApi.opportunities.get(id);
      } else {
        const recent = await PPApi.opportunities.recent();
        if (!recent.length) {
          page.innerHTML = `
            <h1 class="page-title">Match Analysis</h1>
            <div class="card"><div class="card-body" style="text-align:center;padding:3rem;">
              <p style="color:var(--slate-500);">No analysis yet.</p>
              <a class="btn btn-primary mt-4" href="analyzer.html">Find Opportunities</a>
            </div></div>`;
          return;
        }
        analysis = await PPApi.opportunities.get(recent[0].id);
      }
      candidate = await PPApi.http.get('/opportunities/candidate');
    } catch (err) {
      page.innerHTML = `<h1 class="page-title">Match Analysis</h1>
        <p style="color:var(--danger);">Unable to load this analysis. ${esc(err.message)}</p>`;
      return;
    }

    render(analysis, candidate);
  }

  function render(a, candidate) {
    // Skills the portfolio can actually evidence, not merely list.
    const demonstrated = new Set((candidate.demonstratedSkills || []).map(norm));
    const listed = new Set((candidate.skills || []).map(norm));

    const strong = [], partial = [], missing = [];
    (a.strongSkills || []).forEach(s => (demonstrated.has(norm(s)) ? strong : partial).push(s));
    (a.skillGaps || []).forEach(s => (listed.has(norm(s)) ? partial : missing).push(s));

    const jobUrl = localStorage.getItem('pp_last_job_url');

    // Estimate only. Closing a gap changes what the portfolio SHOWS, which is
    // not the same as being offered the role, so it is labelled accordingly.
    const potential = Math.min(100, a.matchScore + Math.min(12, partial.length * 3 + missing.length * 2));

    const recs = [];
    partial.slice(0, 3).forEach(s => recs.push(
      `Add a project or role that shows <strong>${esc(s)}</strong> — it is in your skills but nothing demonstrates it.`));
    missing.slice(0, 2).forEach(s => recs.push(
      `<strong>${esc(s)}</strong> is asked for but not demonstrated. If you have used it, add it to a project.`));
    if ((a.recommendedProjects || []).length) recs.push(
      `Lead your portfolio with <strong>${esc(a.recommendedProjects[0].title)}</strong> for this role.`);
    recs.push('Add measurable outcomes to your strongest project descriptions.');

    page.innerHTML = `
      <div class="flex items-center justify-between" style="flex-wrap:wrap;gap:0.5rem;">
        <div>
          <h1 class="page-title" style="margin-bottom:0.25rem;">${esc(a.jobTitle || 'Match Analysis')}</h1>
          <p class="page-subtitle">${esc(a.company || '')}${a.company ? ' · ' : ''}Portfolio Match Score</p>
        </div>
        <div class="flex gap-2">
          <a class="btn btn-sm btn-ghost" href="analyzer.html">← Opportunities</a>
          ${jobUrl ? `<a class="btn btn-sm btn-secondary" href="${esc(jobUrl)}" target="_blank" rel="noopener noreferrer">View Job</a>` : ''}
        </div>
      </div>

      <div class="grid-2" style="align-items:start;gap:1.5rem;">
        <div class="card">
          <div class="card-body" style="text-align:center;">
            <svg width="200" height="200" viewBox="0 0 200 200" style="max-width:100%;">
              <circle cx="100" cy="100" r="78" fill="none" stroke="#E2E8F0" stroke-width="16"/>
              <circle cx="100" cy="100" r="78" fill="none" stroke="${ringColour(a.matchScore)}" stroke-width="16"
                      stroke-linecap="round" stroke-dasharray="490"
                      stroke-dashoffset="${490 - (490 * a.matchScore / 100)}"
                      transform="rotate(-90 100 100)"/>
              <text x="100" y="112" text-anchor="middle" font-size="42" font-weight="800" fill="#1E293B">${a.matchScore}%</text>
            </svg>
            <p class="text-sm" style="color:var(--slate-500);">
              How well your published portfolio evidences this role. Not a prediction of being hired.
            </p>
          </div>
        </div>

        <div class="card">
          <div class="card-header"><h2 class="card-title">Breakdown</h2></div>
          <div class="card-body">
            ${bar('Skills match', a.skillsMatch, 'green')}
            ${bar('Project relevance', a.projectsMatch, 'primary')}
            ${bar('Requirements met', a.requirementsMatch, 'amber')}
            <p class="text-sm mt-3" style="color:var(--slate-600);">${esc(a.tailoredSummary || '')}</p>
          </div>
        </div>
      </div>

      <div class="card mt-6">
        <div class="card-header"><h2 class="card-title">Skill comparison</h2></div>
        <div class="card-body">
          <div class="table-wrap"><table>
            <thead><tr><th>Required skill</th><th>Your portfolio</th></tr></thead>
            <tbody>
              ${strong.map(s => `<tr><td>${esc(s)}</td><td><span class="badge badge-success">Strong — demonstrated</span></td></tr>`).join('')}
              ${partial.map(s => `<tr><td>${esc(s)}</td><td><span class="badge badge-warning">Partial — listed, not demonstrated</span></td></tr>`).join('')}
              ${missing.map(s => `<tr><td>${esc(s)}</td><td><span class="badge badge-danger">Not demonstrated in your portfolio</span></td></tr>`).join('')}
              ${(!strong.length && !partial.length && !missing.length)
                ? '<tr><td colspan="2" class="text-sm">No specific skills were extracted from this posting.</td></tr>' : ''}
            </tbody>
          </table></div>
        </div>
      </div>

      <div class="grid-2 mt-6" style="align-items:start;gap:1.5rem;">
        <div class="card">
          <div class="card-header"><h2 class="card-title">Portfolio strengths</h2></div>
          <div class="card-body">
            ${strong.length
              ? strong.map(s => `<div class="text-sm mb-2">✓ ${esc(s)} — shown in a project or role</div>`).join('')
              : '<p class="text-sm" style="color:var(--slate-500);">Nothing this posting asks for is demonstrated yet.</p>'}
          </div>
        </div>
        <div class="card">
          <div class="card-header"><h2 class="card-title">Portfolio gaps</h2></div>
          <div class="card-body">
            ${(partial.length || missing.length)
              ? [...partial.map(s => `<div class="text-sm mb-2">◐ ${esc(s)} — listed but not demonstrated</div>`),
                 ...missing.map(s => `<div class="text-sm mb-2">⚠ ${esc(s)} — not demonstrated in your current portfolio</div>`)].join('')
              : '<p class="text-sm" style="color:var(--slate-500);">No gaps found for this posting.</p>'}
            <p class="text-xs mt-3" style="color:var(--slate-400);">
              These describe what your portfolio shows, not what you know.
            </p>
          </div>
        </div>
      </div>

      <div class="card mt-6">
        <div class="card-header"><h2 class="card-title">Most relevant projects</h2></div>
        <div class="card-body">
          ${(a.recommendedProjects || []).length
            ? a.recommendedProjects.map(p => `
              <div class="mb-4">
                <div class="flex items-center justify-between">
                  <strong>${esc(p.title)}</strong>
                  <span class="badge badge-success">${p.relevanceScore}% relevant</span>
                </div>
                <p class="text-sm" style="color:var(--slate-500);">${esc(p.reason || '')}</p>
                ${(p.matchedSkills || []).length ? `<div class="flex mt-1" style="flex-wrap:wrap;gap:0.25rem;">
                  ${p.matchedSkills.map(s => `<span class="tag tag-green">${esc(s)}</span>`).join('')}</div>` : ''}
              </div>`).join('')
            : '<p class="text-sm" style="color:var(--slate-500);">None of your projects overlap this posting yet.</p>'}
        </div>
      </div>

      <div class="card mt-6">
        <div class="card-header"><h2 class="card-title">Improve your match</h2></div>
        <div class="card-body">
          <div class="flex items-center gap-3" style="flex-wrap:wrap;">
            <div><div class="text-xs" style="color:var(--slate-500);">CURRENT</div><strong style="font-size:1.5rem;">${a.matchScore}%</strong></div>
            <span style="color:var(--slate-400);">→</span>
            <div><div class="text-xs" style="color:var(--slate-500);">ESTIMATED AFTER IMPROVEMENTS</div>
              <strong style="font-size:1.5rem;color:var(--success);">${potential}%</strong></div>
          </div>
          <p class="text-xs mt-2" style="color:var(--slate-400);">
            An estimate of how the score could move if your portfolio demonstrated more of what this
            posting asks for. Not a guarantee.
          </p>
          <ol class="mt-4" style="padding-left:1.25rem;">
            ${recs.map(r => `<li class="text-sm mb-2">${r}</li>`).join('')}
          </ol>
          <div class="flex gap-2 mt-4" style="flex-wrap:wrap;">
            <a class="btn btn-sm btn-secondary" href="projects.html">Edit projects</a>
            <a class="btn btn-sm btn-secondary" href="profile.html">Edit profile</a>
            <a class="btn btn-sm btn-primary" href="builder.html">Rebuild portfolio</a>
          </div>
        </div>
      </div>

      <div class="card mt-6">
        <div class="card-header"><h2 class="card-title">Requirements checklist</h2></div>
        <div class="card-body">
          ${(a.requirements || []).length
            ? a.requirements.map(r => `<div class="text-sm mb-2">${r.met ? '✓' : '○'} ${esc(r.text)}</div>`).join('')
            : '<p class="text-sm" style="color:var(--slate-500);">No structured requirements were extracted.</p>'}
        </div>
      </div>`;
  }

  load();
</script>
</body>
</html>
