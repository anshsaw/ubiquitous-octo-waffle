<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio — PortfolioPilot AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="public-portfolio">
    <!-- Nav -->
    <nav class="public-nav">
      <div class="container">
        <a href="#" class="logo" id="navName">Alex Rivera</a>
        <div class="nav-links">
          <a href="#about">About</a>
          <a href="#skills">Skills</a>
          <a href="#projects">Projects</a>
          <a href="#education">Education</a>
          <a href="#contact">Contact</a>
        </div>
        <button class="btn btn-primary btn-sm" onclick="window.print()">Download CV</button>
      </div>
    </nav>

    <!-- Hero -->
    <section class="public-hero" id="about">
      <div class="container">
        <div class="public-avatar" id="avatar">A</div>
        <h1 id="name">Alex Rivera</h1>
        <p class="title" id="title">Full-Stack Developer</p>
        <p class="bio" id="bio"></p>
        <p class="mt-2 text-sm" style="color:var(--slate-400);" id="location"></p>
      </div>
    </section>

    <!-- Skills -->
    <section class="public-section" id="skills">
      <div class="container">
        <h2>Skills</h2>
        <div class="skills-cloud" id="skillsCloud"></div>
      </div>
    </section>

    <!-- Projects -->
    <section class="public-section" id="projects" style="background:var(--slate-50);">
      <div class="container">
        <h2>Featured Projects</h2>
        <div class="project-grid" id="projectsGrid" style="max-width:900px;margin:0 auto;"></div>
      </div>
    </section>

    <!-- Education -->
    <section class="public-section" id="education">
      <div class="container" style="max-width:600px;margin:0 auto;text-align:center;">
        <h2>Education</h2>
        <div id="eduList"></div>
      </div>
    </section>

    <!-- Contact -->
    <section class="public-section" id="contact" style="background:var(--slate-50);">
      <div class="container text-center">
        <h2>Get in touch</h2>
        <p style="color:var(--slate-500);margin-bottom:1.5rem;" id="contactEmail"></p>
        <div class="flex justify-center gap-3">
          <a href="#" class="btn btn-secondary">GitHub</a>
          <a href="#" class="btn btn-secondary">LinkedIn</a>
          <a href="mailto:" class="btn btn-primary" id="emailBtn">Email Me</a>
        </div>
      </div>
    </section>

    <footer class="landing-footer">
      <div class="container">
        <p>Built with <a href="index.html">PortfolioPilot AI</a></p>
      </div>
    </footer>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Public page — no auth required
    const profile = PP.getProfile();
    const match = PP.getLastMatch();
    const recIds = match?.recommendedProjects || [];

    document.getElementById('navName').textContent = profile.name || 'Portfolio';
    document.getElementById('avatar').textContent = (profile.name || 'A').charAt(0).toUpperCase();
    document.getElementById('name').textContent = profile.name || 'Your Name';
    document.getElementById('title').textContent = profile.title || 'Developer';
    document.getElementById('bio').textContent = profile.bio || '';
    document.getElementById('location').textContent = profile.location || '';
    document.getElementById('contactEmail').textContent = profile.email || '';
    document.getElementById('emailBtn').href = 'mailto:' + (profile.email || '');

    document.getElementById('skillsCloud').innerHTML =
      (profile.skills || []).map(s => `<span class="skill-pill">${s.name}</span>`).join('') ||
      '<span style="color:var(--slate-400);">No skills listed</span>';

    let projects = (profile.projects || []).filter(p => p.includeInPortfolio || recIds.includes(p.id));
    projects.sort((a, b) => (recIds.includes(a.id) ? 0 : 1) - (recIds.includes(b.id) ? 0 : 1));

    document.getElementById('projectsGrid').innerHTML = projects.length
      ? projects.map(p => `
          <div class="project-card">
            <div class="card-body">
              <h3>${p.title}</h3>
              <p>${p.description || ''}</p>
              <div class="tech-tags">${(p.tech || []).map(t => `<span class="tag">${t}</span>`).join('')}</div>
              <div class="flex gap-2 mt-2">
                ${p.live ? `<a href="${p.live}" target="_blank" class="btn btn-sm btn-primary">Live Demo</a>` : ''}
                ${p.repo ? `<a href="${p.repo}" target="_blank" class="btn btn-sm btn-secondary">Code</a>` : ''}
              </div>
            </div>
          </div>
        `).join('')
      : '<p style="text-align:center;color:var(--slate-500);grid-column:1/-1;">No featured projects yet.</p>';

    document.getElementById('eduList').innerHTML =
      (profile.education || []).map(e => `
        <div style="margin-bottom:1rem;">
          <div class="font-semibold">${e.degree}</div>
          <div style="color:var(--slate-500);">${e.school} · ${e.year}</div>
        </div>
      `).join('') || '<p style="color:var(--slate-500);">No education listed.</p>';

    // Update page title
    document.title = (profile.name || 'Portfolio') + ' — PortfolioPilot AI';
  </script>
</body>
</html>
