<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio — PortfolioPilot AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!--
    PUBLISHED PUBLIC PORTFOLIO — no authentication required.

    Rendered by the SAME PPRender module that draws the builder's live preview
    and preview.html, so what the user previewed is exactly what a recruiter
    sees. The page used to hand-build its own markup from localStorage, which
    meant it was neither shareable nor consistent with the preview.
  -->
  <div id="portfolioRoot">
    <div class="preview-loading">Loading portfolio…</div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/portfolio-render.js"></script>
  <script>
    /*
     * Username resolution:
     *   ?u=<username>  the shareable form, works signed out
     *   otherwise      the signed-in user's own published portfolio
     *
     * The public endpoint only ever serves a portfolio whose isPublished flag
     * is true, and returns an explicit allow-list of fields — no account email,
     * no phone, no ids.
     */
    const root = document.getElementById('portfolioRoot');

    function fail(message, hint) {
      root.innerHTML =
        '<div class="preview-empty">'
        + '<h1>' + PPRender.esc(message) + '</h1>'
        + (hint ? '<p>' + PPRender.esc(hint) + '</p>' : '')
        + '</div>';
    }

    async function load() {
      const username = new URLSearchParams(window.location.search).get('u');
      let payload;

      try {
        if (username) {
          payload = await PPApi.portfolio.public(username);
        } else {
          const mine = await PP.portfolios.published();
          if (!mine) throw new Error('No portfolio has been published yet.');
          payload = await PPApi.portfolio.public(mine.username);
        }
      } catch (err) {
        fail('Portfolio not available', err.message);
        return;
      }

      /*
       * The public endpoint returns an already-projected shape. Map it onto the
       * renderer's input contract rather than giving PPRender a second code
       * path — one renderer, one set of templates.
       */
      const owner = payload.owner || {};
      const data = PPRender.buildData({
        profile: {
          name: owner.fullName,
          professionalTitle: owner.professionalTitle,
          bio: owner.bio,
          location: owner.location,
          avatarUrl: owner.avatarUrl,
          contact: {
            publicEmail: owner.publicEmail,
            website: owner.website,
            github: owner.github,
            linkedin: owner.linkedin,
            twitter: owner.twitter
          },
          skills: payload.skills || [],
          education: payload.education || [],
          experience: payload.experience || [],
          certificates: payload.certificates || []
        },
        projects: payload.projects || [],
        portfolio: {
          templateKey: payload.templateKey,
          sections: payload.sections,
          sectionOrder: payload.sectionOrder,
          primaryColor: payload.theme && payload.theme.primaryColor,
          accentColor: payload.theme && payload.theme.accentColor,
          darkMode: payload.theme && payload.theme.darkMode,
          // Custom-template surfaces, so a published Custom portfolio keeps the
          // palette the author chose in the builder.
          backgroundColor: payload.theme && payload.theme.backgroundColor,
          surfaceColor: payload.theme && payload.theme.surfaceColor,
          inkColor: payload.theme && payload.theme.inkColor
        },
        template: { name: payload.templateKey }
      });

      PPRender.applyTheme(data, document.documentElement);
      root.innerHTML = PPRender.renderFull(data);
      PPRender.enableSmoothScroll(root);

      document.title = (data.owner.fullName || 'Portfolio') + ' — PortfolioPilot AI';
    }

    load();
  </script>
</body>
</html>
