<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio — PortfolioPilot AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="public-portfolio">
    <!-- Nav -->
    <nav class="public-nav">
      <div class="container">
        <a href="#" class="logo" id="navName">Alex Rivera</a>
        <div class="nav-links">
          <a href="#about">About</a>
          <a href="#skills">Skills</a>
          <a href="#projects">Projects</a>
          <a href="#education">Education</a>
          <a href="#contact">Contact</a>
        </div>
        <button class="btn btn-primary btn-sm" onclick="window.print()">Download CV</button>
      </div>
    </nav>

    <!-- Hero -->
    <section class="public-hero" id="about">
      <div class="container">
        <div class="public-avatar" id="avatar">A</div>
        <h1 id="name">Alex Rivera</h1>
        <p class="title" id="title">Full-Stack Developer</p>
        <p class="bio" id="bio"></p>
        <p class="mt-2 text-sm" style="color:var(--slate-400);" id="location"></p>
      </div>
    </section>

    <!-- Skills -->
    <section class="public-section" id="skills">
      <div class="container">
        <h2>Skills</h2>
        <div class="skills-cloud" id="skillsCloud"></div>
      </div>
    </section>

    <!-- Projects -->
    <section class="public-section" id="projects" style="background:var(--slate-50);">
      <div class="container">
        <h2>Featured Projects</h2>
        <div class="project-grid" id="projectsGrid" style="max-width:900px;margin:0 auto;"></div>
      </div>
    </section>

    <!-- Education -->
    <section class="public-section" id="education">
      <div class="container" style="max-width:600px;margin:0 auto;text-align:center;">
        <h2>Education</h2>
        <div id="eduList"></div>
      </div>
    </section>

    <!-- Contact -->
    <section class="public-section" id="contact" style="background:var(--slate-50);">
      <div class="container text-center">
        <h2>Get in touch</h2>
        <p style="color:var(--slate-500);margin-bottom:1.5rem;" id="contactEmail"></p>
        <div class="flex justify-center gap-3">
          <a href="#" class="btn btn-secondary">GitHub</a>
          <a href="#" class="btn btn-secondary">LinkedIn</a>
          <a href="mailto:" class="btn btn-primary" id="emailBtn">Email Me</a>
        </div>
      </div>
    </section>

    <footer class="landing-footer">
      <div class="container">
        <p>Built with <a href="index.html">PortfolioPilot AI</a></p>
      </div>
    </footer>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    /*
     * PUBLIC PAGE — no auth required.
     *
     * Reads the published portfolio from GET /api/public/portfolio/{username}.
     * Previously this rendered the current browser's localStorage, which meant
     * the page was not actually shareable and never reflected the template
     * chosen in the builder.
     *
     * Username resolution: ?u=<username> in the URL, else the signed-in user's
     * own published portfolio (so "preview mine" still works).
     */
    const esc = (v) => String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

    const safeUrl = (u) => {
      // Only http(s) links are rendered — blocks javascript: in a stored field.
      if (!u) return null;
      try {
        const parsed = new URL(u, window.location.href);
        return (parsed.protocol === 'http:' || parsed.protocol === 'https:') ? parsed.href : null;
      } catch (e) { return null; }
    };

    function show(id, visible) {
      const el = document.getElementById(id);
      if (el) el.style.display = visible ? '' : 'none';
    }

    /** Applies the chosen template: a body class plus its real theme colours. */
    function applyTemplate(data) {
      const key = data.templateKey || 'MODERN_DEV';
      document.body.classList.add('tpl-' + key.toLowerCase().replace(/_/g, '-'));
      document.body.dataset.template = key;

      const theme = data.theme || {};
      const root = document.documentElement;
      if (theme.primaryColor) root.style.setProperty('--primary', theme.primaryColor);
      if (theme.accentColor) root.style.setProperty('--success', theme.accentColor);
      if (theme.darkMode) document.body.classList.add('tpl-dark');
    }

    async function render() {
      const username = new URLSearchParams(window.location.search).get('u');
      let data;

      try {
        if (username) {
          data = await PPApi.portfolio.public(username);
        } else {
          const mine = await PP.portfolios.published();
          if (!mine) throw new Error('You have not published a portfolio yet. Open the Builder first.');
          data = await PPApi.portfolio.public(mine.username);
        }
      } catch (err) {
        document.body.innerHTML =
          '<div style="max-width:640px;margin:6rem auto;text-align:center;font-family:Inter,sans-serif;">'
          + '<h1 style="font-size:1.5rem;margin-bottom:0.75rem;">Portfolio not available</h1>'
          + '<p style="color:#64748B;">' + esc(err.message) + '</p></div>';
        return;
      }

      applyTemplate(data);

      const owner = data.owner || {};
      const sections = data.sections || {};

      document.getElementById('navName').textContent = owner.fullName || 'Portfolio';
      document.getElementById('avatar').textContent = (owner.fullName || 'A').charAt(0).toUpperCase();
      document.getElementById('name').textContent = owner.fullName || '';
      document.getElementById('title').textContent = owner.professionalTitle || '';
      document.getElementById('bio').textContent = owner.bio || '';
      document.getElementById('location').textContent = owner.location || '';

      // Only the address the owner chose to publish — never the account email.
      const publicEmail = owner.publicEmail || '';
      document.getElementById('contactEmail').textContent = publicEmail || 'Not published';
      document.getElementById('emailBtn').href = publicEmail ? 'mailto:' + publicEmail : '#';

      // Sections the owner switched off come back empty from the API; hide them
      // so the page has no stranded headings.
      show('skills', sections.skills !== false);
      show('projects', sections.projects !== false);
      show('education', sections.education !== false);
      show('contact', sections.contact !== false);

      document.getElementById('skillsCloud').innerHTML =
        (data.skills || []).map(s => `<span class="skill-pill">${esc(s.name)}</span>`).join('') ||
        '<span style="color:var(--slate-400);">No skills listed</span>';

      // Already ordered by the server: job-relevant projects first.
      document.getElementById('projectsGrid').innerHTML = (data.projects || []).length
        ? data.projects.map(p => {
            const live = safeUrl(p.liveDemoUrl);
            const repo = safeUrl(p.repositoryUrl);
            return `
            <div class="project-card">
              <div class="card-body">
                <h3>${esc(p.title)}</h3>
                <p>${esc(p.description || '')}</p>
                <div class="tech-tags">${(p.techStack || []).map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
                <div class="flex gap-2 mt-2">
                  ${live ? `<a href="${esc(live)}" target="_blank" rel="noopener noreferrer" class="btn btn-sm btn-primary">Live Demo</a>` : ''}
                  ${repo ? `<a href="${esc(repo)}" target="_blank" rel="noopener noreferrer" class="btn btn-sm btn-secondary">Code</a>` : ''}
                </div>
              </div>
            </div>`;
          }).join('')
        : '<p style="text-align:center;color:var(--slate-500);grid-column:1/-1;">No featured projects yet.</p>';

      document.getElementById('eduList').innerHTML =
        (data.education || []).map(e => {
          const years = [e.startYear, e.endYear].filter(Boolean).join(' - ');
          return `
          <div style="margin-bottom:1rem;">
            <div class="font-semibold">${esc(e.degree)}</div>
            <div style="color:var(--slate-500);">${esc(e.institution)}${years ? ' · ' + esc(years) : ''}</div>
          </div>`;
        }).join('') || '<p style="color:var(--slate-500);">No education listed.</p>';

      document.title = (owner.fullName || 'Portfolio') + ' — PortfolioPilot AI';
    }

    render();
  </script>
</body>
</html>
