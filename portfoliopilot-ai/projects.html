<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Projects — PortfolioPilot AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand"><span>⚡</span> PortfolioPilot</div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item" data-page="dashboard"><span class="icon">🏠</span> Dashboard</a>
        <a href="profile.html" class="nav-item" data-page="profile"><span class="icon">👤</span> Profile</a>
        <a href="projects.html" class="nav-item active" data-page="projects"><span class="icon">📁</span> My Projects</a>
        <a href="match-analysis.html" class="nav-item" data-page="match"><span class="icon">📊</span> Match Analysis</a>
        <a href="builder.html" class="nav-item" data-page="builder"><span class="icon">🛠️</span> Portfolio Builder</a>
        <a href="portfolio.html" class="nav-item" data-page="public" target="_blank"><span class="icon">🌐</span> Published Site</a>
      </nav>
      <div class="sidebar-footer">
        <button class="btn btn-ghost btn-block" onclick="PP.logout()">Logout</button>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="main-content">
      <header class="topbar">
        <button class="menu-toggle" id="menuToggle">☰</button>
        <div class="flex items-center gap-3">
          <span class="text-sm">Hi, <strong id="userName">User</strong></span>
        </div>
      </header>

      <main class="page-content">
        <div class="flex items-center justify-between mb-6" style="flex-wrap: wrap; gap: 1rem;">
          <div>
            <h1 class="page-title" style="margin-bottom: 0.25rem;">My Projects</h1>
            <p class="page-subtitle" style="margin-bottom: 0;">Manage and showcase your projects for AI tailoring.</p>
          </div>
          <button class="btn btn-primary" id="openAddModalBtn"><span>+</span> Add New Project</button>
        </div>

        <!-- Empty State -->
        <div id="noProjects" class="card hidden">
          <div class="card-body text-center" style="padding: 3rem;">
            <p style="color: var(--slate-500); margin-bottom: 1.5rem;">No projects added yet. Start adding your portfolio work to run match analyses.</p>
            <button class="btn btn-primary" onclick="document.getElementById('openAddModalBtn').click()">Add Your First Project</button>
          </div>
        </div>

        <!-- Projects Grid -->
        <div id="projectsGrid" class="grid gap-6" style="grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));"></div>
      </main>
    </div>
  </div>

  <!-- Add/Edit Project Modal -->
  <div class="modal-overlay" id="projectModal">
    <div class="modal" style="max-width: 600px;">
      <div class="modal-header">
        <h3 id="modalTitle">Add New Project</h3>
        <button class="modal-close" id="closeModal">×</button>
      </div>
      <form id="projectForm">
        <div class="modal-body">
          <input type="hidden" id="projectId" />
          <div class="form-group mb-4">
            <label class="form-label" for="projTitle">Project Title</label>
            <input type="text" id="projTitle" class="form-control" placeholder="e.g. PortfolioPilot AI" required />
          </div>
          <div class="form-group mb-4">
            <label class="form-label" for="projTech">Tech Stack (comma separated)</label>
            <input type="text" id="projTech" class="form-control" placeholder="e.g. Java, Spring Boot, MongoDB, JavaScript" required />
          </div>
          <div class="form-group mb-4">
            <label class="form-label" for="projDesc">Description</label>
            <textarea id="projDesc" class="form-control" rows="4" placeholder="Briefly describe what this project does..." required></textarea>
          </div>
          <div class="form-group mb-4">
            <label class="form-label" for="projLink">Project / GitHub URL (Optional)</label>
            <input type="url" id="projLink" class="form-control" placeholder="https://github.com/username/project" />
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cancelModal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Project</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    if (!PP.requireAuth()) throw new Error('redirect');
    PP.initAppLayout('projects');

    const projectModal = document.getElementById('projectModal');
    const projectForm = document.getElementById('projectForm');

    function renderProjects() {
      const profile = PP.getProfile();
      const userNameElem = document.getElementById('userName');
      if (userNameElem) userNameElem.textContent = profile.name || 'User';

      const projects = profile.projects || [];
      const grid = document.getElementById('projectsGrid');
      const noProj = document.getElementById('noProjects');

      if (projects.length === 0) {
        grid.innerHTML = '';
        noProj.classList.remove('hidden');
        return;
      }

      noProj.classList.add('hidden');
      grid.innerHTML = projects.map(p => `
        <div class="card">
          <div class="card-body flex flex-col justify-between" style="height: 100%;">
            <div>
              <div class="flex items-center justify-between mb-2">
                <h3 class="font-medium" style="font-size: 1.125rem;">${p.title}</h3>
                ${p.link ? `<a href="${p.link}" target="_blank" style="font-size: 0.875rem; color: var(--primary);">Link ↗</a>` : ''}
              </div>
              <p class="text-sm mb-4" style="color: var(--slate-500); line-height: 1.5;">${p.description || 'No description provided.'}</p>
              <div class="flex gap-2 mb-4" style="flex-wrap: wrap;">
                ${(p.tech || []).map(t => `<span class="tag tag-green">${t}</span>`).join('')}
              </div>
            </div>
            <div class="flex gap-2 pt-3" style="border-top: 1px solid var(--slate-100);">
              <button class="btn btn-ghost btn-sm" onclick="editProject('${p.id}')">Edit</button>
              <button class="btn btn-ghost btn-sm" style="color: var(--warning);" onclick="deleteProject('${p.id}')">Delete</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    // Add / Edit handlers
    document.getElementById('openAddModalBtn').addEventListener('click', () => {
      document.getElementById('modalTitle').textContent = 'Add New Project';
      document.getElementById('projectId').value = '';
      projectForm.reset();
      projectModal.classList.add('open');
    });

    function closeModal() { projectModal.classList.remove('open'); }
    document.getElementById('closeModal').addEventListener('click', closeModal);
    document.getElementById('cancelModal').addEventListener('click', closeModal);

    projectForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const id = document.getElementById('projectId').value || 'proj_' + Date.now();
      const title = document.getElementById('projTitle').value;
      const tech = document.getElementById('projTech').value.split(',').map(s => s.trim()).filter(Boolean);
      const description = document.getElementById('projDesc').value;
      const link = document.getElementById('projLink').value;

      const profile = PP.getProfile();
      profile.projects = profile.projects || [];

      const existingIdx = profile.projects.findIndex(p => p.id === id);
      const newProj = { id, title, tech, description, link, includeInPortfolio: true };

      if (existingIdx > -1) {
        profile.projects[existingIdx] = newProj;
      } else {
        profile.projects.push(newProj);
      }

      PP.saveProfile(profile);
      closeModal();
      renderProjects();
    });

    window.editProject = function(id) {
      const profile = PP.getProfile();
      const proj = (profile.projects || []).find(p => p.id === id);
      if (!proj) return;

      document.getElementById('modalTitle').textContent = 'Edit Project';
      document.getElementById('projectId').value = proj.id;
      document.getElementById('projTitle').value = proj.title || '';
      document.getElementById('projTech').value = (proj.tech || []).join(', ');
      document.getElementById('projDesc').value = proj.description || '';
      document.getElementById('projLink').value = proj.link || '';
      projectModal.classList.add('open');
    };

    window.deleteProject = function(id) {
      if (!confirm('Are you sure you want to delete this project?')) return;
      const profile = PP.getProfile();
      profile.projects = (profile.projects || []).filter(p => p.id !== id);
      PP.saveProfile(profile);
      renderProjects();
    };

    renderProjects();
  </script>
</body>
</html>
